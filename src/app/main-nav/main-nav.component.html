<!-- main-nav.component.html — grouped sidebar; the navigation model lives in main-nav.component.ts -->
<aside class="sb" [class.sb--mini]="collapsed">

  <div class="sb-brand">
    <a class="sb-logo" routerLink="/dashboard" title="UniDocVerse home">
      <span class="sb-mark">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M4 3L4 12Q4 17 10 17Q16 17 16 12L16 3" stroke="#1f4fd1" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="10" cy="7" r="1.8" fill="#0f7a55"/><circle cx="10" cy="11" r="1.8" fill="#1f4fd1"/><circle cx="10" cy="15" r="1.8" fill="#d99a06"/>
        </svg>
      </span>
      <span class="sb-name">Uni<b>Doc</b>Verse</span>
    </a>
    <button class="sb-collapse" (click)="toggleCollapsed()" [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <i class="ti" [class.ti-layout-sidebar-left-collapse]="!collapsed" [class.ti-layout-sidebar-left-expand]="collapsed"></i>
    </button>
  </div>

  <nav class="sb-scroll" aria-label="Main">
    <ng-container *ngFor="let g of groups">
      <section class="sb-sec" *ngIf="on(g.flag)">
        <button class="sb-lbl" (click)="toggleGroup(g.key)" [attr.aria-expanded]="!closed[g.key]">
          <span>{{ g.label | translate }}</span>
          <i class="ti ti-chevron-down sb-caret" [class.sb-caret--shut]="closed[g.key]"></i>
        </button>

        <div class="sb-items" *ngIf="!closed[g.key] || collapsed">
          <!-- Plain links -->
          <ng-container *ngFor="let it of g.items">
            <a *ngIf="visible(it)" class="sb-a" [routerLink]="it.link" [queryParams]="it.query || null"
               [class.on]="isActive(it)" [attr.title]="collapsed ? (it.label | translate) : null">
              <i class="ti ti-{{ it.icon }} sbi"></i>
              <span class="sb-txt">{{ it.label | translate }}</span>
              <span class="sb-badge" *ngIf="it.badge === 'docs' && docCount > 0">{{ docCount }}</span>
            </a>
          </ng-container>

          <!-- Workspaces: one entry each, expanding into its pages -->
          <ng-container *ngFor="let ws of g.workspaces">
            <div class="sb-ws" *ngIf="on(ws.flag)">
              <button class="sb-a sb-ws-head" [class.sb-ws-head--on]="wsActive(ws)" (click)="toggleWs(ws.label)"
                      [attr.aria-expanded]="!!openWs[ws.label]" [attr.title]="collapsed ? (ws.label | translate) : null">
                <i class="ti ti-{{ ws.icon }} sbi"></i>
                <span class="sb-txt">{{ ws.label | translate }}</span>
                <i class="ti ti-chevron-right sb-ws-caret" [class.sb-ws-caret--open]="openWs[ws.label]"></i>
              </button>
              <div class="sb-ws-items" *ngIf="openWs[ws.label] && !collapsed">
                <a *ngFor="let it of ws.items" class="sb-sub" [routerLink]="it.link" [queryParams]="it.query || null"
                   [class.on]="isActive(it)">{{ it.label | translate }}</a>
              </div>
            </div>
          </ng-container>
        </div>
      </section>
    </ng-container>
  </nav>

  <div class="sb-bot">
    <div class="sb-sto" [attr.title]="storageUsed + ' MB of 10 GB used'">
      <div class="sb-sto-row"><span>{{ 'Storage' | translate }}</span><span class="sb-mono">{{ storageUsed }} MB / 10 GB</span></div>
      <div class="sb-sto-bar"><div class="sb-sto-fill" [style.width.%]="storagePercent"></div></div>
    </div>
  </div>
</aside>
<app-toast></app-toast>
