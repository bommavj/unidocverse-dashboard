<div class="app-shell">
  <app-license-warning-banner></app-license-warning-banner>
  <div class="app-body">
    @if (auth.isLoggedIn()) {
      <app-main-nav (openAskAi)="askAiOpen=true" (openVoice)="voiceOpen=true"></app-main-nav>
    }
    <div class="page-content">
      @if (auth.isLoggedIn()) {
        <app-top-bar (openAskAi)="askAiOpen=true" (openVoice)="voiceOpen=true"></app-top-bar>
      }
      <router-outlet></router-outlet>
    </div>
  </div>
  <app-global-ask-ai [isOpen]="askAiOpen" [initialQuery]="voiceQuery" (closed)="askAiOpen=false; voiceQuery=''"></app-global-ask-ai>
  <app-voice-assistant [isOpen]="voiceOpen" (closed)="voiceOpen=false" (forwardToAi)="onForwardToAi($event)"></app-voice-assistant>
</div>
